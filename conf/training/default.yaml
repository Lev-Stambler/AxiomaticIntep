pga_batch_size: 64
eval_batch_size: 128
pga_its: 512
dict_size: 1
learning_rate: 0.2
k: 1
beta1: 0.9
beta2: 0.999
eps: 1e-4
weight_decay: 1e-2
sample_temp: 0.2
norm_lower_bound: 0.5
norm_upper_bound: 90.0

early_stopping:
  enabled: false
  patience: 5
  min_delta: 1e-6
  eval_freq: 10

inactive_mode: "soft"
eps_check: 0.05 # TODO: important!
inactive_sigma: 0.1
