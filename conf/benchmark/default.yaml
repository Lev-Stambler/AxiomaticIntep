enabled_benchmarks:
  - ravel
  - mib

directions_path: directions.pkl
direction_indices: null  # Use all directions
orthonormalize_featurizer: true
output_format: json

ravel:
  entity_types:
    - cities
    - nobel
    - verbs
    - objects
    - occupations
  attributes_per_entity: -1  # All attributes
  ravel_repo_path: null
  use_cached_data: true

mib:
  tasks:
    - ioi
    - arithmetic
    - mcqa
    - arc_easy
    - ravel
  max_samples_per_task: -1  # All samples
  hf_cache_dir: null
