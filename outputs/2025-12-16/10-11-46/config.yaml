model:
  model_name: EleutherAI/pythia-70m-deduped
  model_name_sae: pythia-70m-deduped
  layer_cutoff: 2
  hook_type: hook_resid_post
  max_seq_len: 40
  target_norm: 10.0
  use_output_logits: false
  target_token_offset: 0
  target_layers: null
  n_norm_discretization_steps: 1
training:
  pga_batch_size: 64
  eval_batch_size: 128
  pga_its: 512
  dict_size: 1
  learning_rate: 0.2
  k: 1
  beta1: 0.9
  beta2: 0.999
  eps: 0.0001
  weight_decay: 0.01
  sample_temp: 0.2
  norm_lower_bound: 0.5
  norm_upper_bound: 90.0
  early_stopping:
    enabled: false
    patience: 5
    min_delta: 1.0e-06
    eval_freq: 10
  inactive_mode: soft
  eps_check: 0.1
  inactive_sigma: 0.1
database:
  num_similar_to_find: 20
  index_size: 10000
  index_batch_size: 128
  scoring_type: dot
  chroma_db_path: null
  save_activations: true
  use_MICS: true
llm:
  explainer:
    provider: openrouter
    model_name: anthropic/claude-3.5-sonnet
  faithfulness:
    provider: openrouter
    model_name: anthropic/claude-3.5-sonnet
  positive_negative_explanations: true
dataset:
  dataset_name: allenai/c4
  dataset_config: en
  dataset_data_files: null
  dataset_split: train
  dataset_streaming: true
  dataset_text_column: text
  force_dataset_download: false
benchmark:
  enabled_benchmarks:
  - ravel
  - mib
  directions_path: directions.pkl
  direction_indices: null
  orthonormalize_featurizer: true
  output_format: json
  ravel:
    entity_types:
    - cities
    - nobel
    - verbs
    - objects
    - occupations
    attributes_per_entity: -1
    ravel_repo_path: null
    use_cached_data: true
  mib:
    tasks:
    - ioi
    - arithmetic_add
    - arithmetic_sub
    - mcqa
    - arc_easy
    - ravel
    max_samples_per_task: -1
    hf_cache_dir: null
visualization:
  enabled: true
  num_examples: 20
seed: 62
output_dir: ${hydra:runtime.output_dir}
