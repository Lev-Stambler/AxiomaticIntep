[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interventionfeatures"
version = "0.1.0"
description = "A package for mechanistic interpretability using Fourier features and Causal Scrubbing Search (CSS)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Lev Stambler", email = "lev@example.com"},
]
keywords = ["machine learning", "interpretability", "transformers", "mechanistic interpretability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=1.9.0",
    "transformers>=4.20.0",
    "datasets>=2.0.0",
    "numpy>=1.21.0",
    "tqdm>=4.60.0",
    "matplotlib>=3.5.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "transformer-lens>=1.0.0",
    "sae-lens>=1.0.0",
    "python-dotenv>=0.19.0",
    "pydantic>=2.0.0",
    "rich>=12.0.0",
    "typer>=0.9.0",
    "tomli>=1.2.0; python_version<'3.11'",
    "tomli-w>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=2.20.0",
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
]

gui = [
    "tkinter; platform_system != 'Darwin'",
]

search = [
    "chromadb>=0.4.0",
]

explain = [
    "langchain-anthropic>=0.1.0",
    "langchain-core>=0.1.0",
]

optimization = [
    "ax-platform>=0.3.0",
]

all = [
    "interventionfeatures[dev,gui,search,explain,optimization]",
]

[project.urls]
"Homepage" = "https://github.com/your-username/interventionfeatures"
"Bug Reports" = "https://github.com/your-username/interventionfeatures/issues"
"Source" = "https://github.com/your-username/interventionfeatures"

[project.scripts]
interventionfeatures = "interventionfeatures.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 100
target-version = ['py38']
include = '\.pyi?$'

[tool.ruff]
target-version = "py38"
line-length = 100
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=interventionfeatures --cov-report=term-missing --cov-report=xml"
