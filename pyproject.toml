[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "interventionfeatures"
version = "0.2.0"
description = "Mechanistic interpretability using CSS and activation patching"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Lev Stambler"},
]
keywords = ["machine learning", "interpretability", "transformers", "mechanistic interpretability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "datasets>=2.14.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "transformer-lens>=1.0.0",
    "sae-lens>=1.0.0",
    "python-dotenv>=1.0.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "bitsandbytes>=0.41.0",
]

[project.optional-dependencies]
search = [
    "chromadb>=0.4.0",
    "pysqlite3-binary>=0.5.0",
]

explain = [
    "langchain-anthropic>=0.1.0",
    "langchain-openai>=0.1.0",
    "langchain-core>=0.1.0",
]

dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

viz = [
    "streamlit>=1.28.0",
]

benchmark = [
    "pyvene>=0.1.4",
]

all = [
    "interventionfeatures[search,explain,dev,viz,benchmark]",
]

[project.urls]
"Homepage" = "https://github.com/levstambler/interventionfeatures"
"Bug Reports" = "https://github.com/levstambler/interventionfeatures/issues"

[project.scripts]
interventionfeatures = "interventionfeatures.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/interventionfeatures"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008", "C901"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
